<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kontakt – Akwamaryn PL Dogs</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Montserrat', sans-serif;
      color:#fff;
      background:#0f0f0f;
    }

    /* MENU */
    .topbar{
      position:fixed;
      top:0;
      width:100%;
      background:rgba(0,0,0,0.5);
      backdrop-filter:blur(10px);
      z-index:1000;
    }

    .topbar-inner{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
    }

    .brand{
      font-family:'Cormorant Garamond', serif;
      font-size:24px;
    }

    .menu{
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .menu a{
      color:#fff;
      text-decoration:none;
      font-size:13px;
    }

    /* SEKCJA */
    .hero{
      min-height:100vh;
      padding:120px 20px 40px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.75)),
        url('images/diana/file_00000000c21871fda440cb45f0f95a0c.png') center/cover no-repeat;
    }

    .box{
      max-width:900px;
      width:100%;
      background:rgba(0,0,0,0.6);
      padding:30px;
      border-radius:12px;
      backdrop-filter:blur(10px);
    }

    h1{
      font-family:'Cormorant Garamond', serif;
      font-size:42px;
      margin-bottom:20px;
      text-align:center;
    }

    p{
      text-align:center;
      margin-bottom:25px;
    }

    .contact-info{
      margin-bottom:30px;
      line-height:1.8;
      text-align:center;
    }

    .contact-info a{
      color:#fff;
      text-decoration:none;
    }

    /* FORMULARZ */
    form{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    input, textarea{
      padding:12px;
      border:none;
      border-radius:8px;
      background:rgba(255,255,255,0.1);
      color:#fff;
    }

    button{
      padding:12px;
      border:none;
      border-radius:8px;
      background:rgba(255,255,255,0.2);
      color:#fff;
      cursor:pointer;
    }

    .success{
      margin-top:15px;
      text-align:center;
      display:none;
    }

    /* MOBILE */
    @media(max-width:768px){
      .menu{
        justify-content:center;
      }
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">Akwamaryn PL Dogs</div>

    <div class="menu">
      <a href="index.html">Start</a>
      <a href="o-nas.html">O nas</a>
      <a href="psy.html">Psy</a>
      <a href="suczki.html">Suczki</a>
      <a href="miot.html">Miot</a>
      <a href="wystawy.html">Wystawy</a>
      <a href="sukcesy.html">Sukcesy</a>
      <a href="nasze-wychowanki.html">Wychowanki</a>
      <a href="kontakt.html">Kontakt</a>
    </div>

  </div>
</div>

<section class="hero">

  <div class="box">

    <h1>Kontakt</h1>

    <p>Jeśli chcesz się z nami skontaktować — zapraszamy</p>

    <div class="contact-info">
      <strong>Osoba do kontaktu:</strong> Agnieszka<br>
      <strong>Telefon:</strong> <a href="tel:+48572992736">+48 572 992 736</a><br>
      <strong>Email:</strong> <a href="mailto:agnieszka90m@gmail.com">agnieszka90m@gmail.com</a><br>
      <strong>Facebook:</strong> <a href="https://www.facebook.com/share/189TPjiudK/?mibextid=wwXIfr" target="_blank">Kliknij tutaj</a>
    </div>

    <form id="form">
      <input type="text" placeholder="Imię" required>
      <input type="email" placeholder="Email" required>
      <textarea placeholder="Wiadomość" required></textarea>
      <button type="submit">Wyślij</button>
    </form>

    <div class="success" id="successMsg">
      Wiadomość została wysłana. Odpowiemy wkrótce.
    </div>

  </div>

</section>

<script>
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();
  document.getElementById("successMsg").style.display = "block";
});
</script>

</body>
</html>
