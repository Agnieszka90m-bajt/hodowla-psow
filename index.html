<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skarb Akwamarynu FCI</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Montserrat', sans-serif;
  background:#0f0f0f;
  color:#fff;
}

/* ===== MENU ===== */
.topbar{
  position:fixed;
  top:0;
  width:100%;
  z-index:3000;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

.topbar-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 25px;
}

.brand{
  font-family:'Cormorant Garamond', serif;
  font-size:26px;
  letter-spacing:1px;
}

.menu-btn{
  font-size:26px;
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
}

/* ===== MENU BOCZNE ===== */
.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:2000;
}

.menu-overlay.active{
  opacity:1;
  pointer-events:auto;
}

.mobile-menu{
  position:fixed;
  top:0;
  right:-300px;
  width:300px;
  height:100%;
  background:#111;
  padding:100px 25px;
  display:flex;
  flex-direction:column;
  gap:20px;
  transition:.3s;
  z-index:2500;
}

.mobile-menu.open{
  right:0;
}

.mobile-menu a{
  color:#fff;
  text-decoration:none;
  font-size:16px;
}

/* ===== HERO ===== */
.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;

  background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8)),
    url('charlot/file_00000000115c722fbb55be2450a7b585.png');

  background-size:cover;
  background-position:center;
}

.hero-content{
  max-width:800px;
  padding:20px;
}

.hero h1{
  font-family:'Cormorant Garamond', serif;
  font-size:58px;
  font-weight:400;
}

.gold{
  color:#d9b36a;
}

.hero p{
  margin-top:20px;
  font-size:18px;
  line-height:1.7;
  opacity:.9;
}

/* ===== RESPONSYWNOŚĆ ===== */
@media(max-width:768px){

  .hero{
    background-position:center top;
  }

  .hero h1{
    font-size:36px;
  }

  .hero p{
    font-size:15px;
  }

}
</style>
</head>

<body>

<!-- overlay -->
<div class="menu-overlay" id="overlay"></div>

<!-- TOP -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">Skarb Akwamarynu FCI</div>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
  </div>
</div>

<!-- MENU -->
<div class="mobile-menu" id="menu">
  <a href="index.html">Start</a>
  <a href="o-nas.html">O nas</a>
  <a href="psy.html">Psy</a>
  <a href="suczki.html">Suczki</a>
  <a href="miot.html">Aktualny miot</a>
  <a href="kontakt.html">Kontakt</a>
</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Skarb <span class="gold">Akwamarynu</span> FCI</h1>

    <p>
      Hodowla tworzona z pasji do piękna, charakteru i prawdziwej relacji z psem.
      Nasze psy to nie tylko rodowody — to przede wszystkim członkowie naszej rodziny.
    </p>
  </div>
</section>

<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("active");
}

document.getElementById("overlay").onclick = function(){
  document.getElementById("menu").classList.remove("open");
  this.classList.remove("active");
}
</script>

</body>
</html>
