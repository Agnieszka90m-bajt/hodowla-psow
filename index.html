<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hodowla Chihuahua</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family: 'Montserrat', sans-serif;
background:#faf7f8;
color:#3a2e33;
}

/* MENU */
header{
position:fixed;
width:100%;
top:0;
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
z-index:999;
}

.logo{
font-family:'Playfair Display', serif;
font-size:22px;
color:#c9a86a;
letter-spacing:1px;
}

nav{
display:flex;
gap:25px;
}

nav a{
text-decoration:none;
color:#5c4a50;
font-size:13px;
letter-spacing:1px;
transition:0.3s;
position:relative;
}

nav a::after{
content:'';
position:absolute;
width:0;
height:1px;
background:#c9a86a;
bottom:-5px;
left:0;
transition:0.3s;
}

nav a:hover::after{
width:100%;
}

nav a:hover{
color:#c9a86a;
}

/* HERO */
.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1518717758536-85ae29035b6d') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h1{
font-family:'Playfair Display', serif;
font-size:52px;
color:white;
background:rgba(0,0,0,0.4);
padding:25px 50px;
border-radius:20px;
}

/* SEKCJE */
section{
padding:100px 20px;
max-width:1100px;
margin:auto;
}

h2{
text-align:center;
margin-bottom:40px;
font-family:'Playfair Display', serif;
color:#c9a86a;
}

/* KARTY */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.card-content h3{
font-family:'Playfair Display', serif;
margin-bottom:10px;
}

/* STOPKA */
footer{
text-align:center;
padding:50px;
color:#8c757d;
}
</style>
</head>

<body>

<header>
<div class="logo">Akwamaryn Dogs</div>
<nav>
<a href="#psy">Psy w hodowli</a>
<a href="#szczeniaki">Szczeniaki</a>
<a href="#tytuly">Tytuły</a>
<a href="#plany">Plany</a>
<a href="#opinie">Opinie</a>
<a href="#kontakt">Kontakt</a>
</nav>
</header>

<div class="hero">
<h1>Elegancja. Pasja. Chihuahua.</h1>
</div>

<section id="psy">
<h2>Psy w hodowli</h2>
<div class="grid">
<div class="card">
<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9">
<div class="card-content">
<h3>Imię psa</h3>
<p>Opis psa</p>
</div>
</div>
</div>
</section>

<section id="szczeniaki">
<h2>Szczeniaki</h2>
<p style="text-align:center;">Aktualny miot</p>
</section>

<section id="tytuly">
<h2>Tytuły</h2>
<p style="text-align:center;">Championaty i osiągnięcia</p>
</section>

<section id="plany
